<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Office of Dr. Ramatoulaye Diallo N'Diaye</title>
  <meta name="description"
    content="Pan-African Diplomat & Global Strategist for Climate Resilience, Green Industrialization, and Cultural Power." />
  <link rel="stylesheet" href="/src/index.css" />
</head>

<body class="h-full overflow-hidden bg-black text-white font-sans antialiased">

  <!-- Gateway Container - 100vh, No Scroll -->
  <div class="relative h-screen w-full overflow-hidden">

    <!-- Background with subtle texture/pattern -->
    <div class="absolute inset-0 bg-black">
      <!-- Subtle gradient overlay for depth -->
      <div class="absolute inset-0" style="background: radial-gradient(ellipse at 20% 50%, rgba(30,30,30,1) 0%, rgba(0,0,0,1) 70%);"></div>
      <!-- Subtle vertical lines pattern -->
      <div class="absolute inset-0 opacity-[0.03]" style="background-image: repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(255,255,255,0.5) 80px, rgba(255,255,255,0.5) 81px);"></div>
      <!-- Corner accent -->
      <div class="absolute bottom-0 left-0 w-[40%] h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
      <div class="absolute top-0 left-0 w-[1px] h-[30%] bg-gradient-to-b from-white/10 to-transparent"></div>
    </div>

    <!-- Portrait Image - Right Side -->
    <div class="absolute right-0 top-0 h-full w-[65%] lg:w-[58%] flex items-start justify-end overflow-hidden">
      <img src="/assets/home-background.jpg" alt="Dr. Ramatoulaye Diallo N'Diaye"
        class="h-[110%] object-contain object-right filter grayscale origin-top-right" style="transform: scale(1.1); margin-top: 5vh;" />
      <div class="absolute inset-0 bg-gradient-to-r from-black via-black/60 to-transparent"></div>
    </div>

    <!-- Top Left Logo -->
    <div class="absolute top-8 left-8 md:top-12 md:left-12 z-20">
      <h2 class="font-serif text-lg md:text-xl text-white tracking-wide max-w-xs leading-snug font-medium" style="text-shadow: 0 2px 10px rgba(0,0,0,0.8);">
        The Office of<br />Dr. Ramatoulaye Diallo N'Diaye
      </h2>
    </div>

    <!-- Mobile Navigation Toggle -->
    <button id="mobile-menu-btn" class="lg:hidden fixed top-8 right-8 flex flex-col justify-center items-center w-8 h-8" style="z-index: 999999;">
      <span class="block w-6 h-0.5 bg-white mb-1.5 transition-all"></span>
      <span class="block w-6 h-0.5 bg-white mb-1.5 transition-all"></span>
      <span class="block w-6 h-0.5 bg-white transition-all"></span>
    </button>

    <!-- Mobile Navigation Menu -->
    <nav id="mobile-menu" class="lg:hidden fixed inset-0 bg-black/95 hidden flex-col items-center justify-center" style="z-index: 999998;">
      <div class="flex flex-col items-center space-y-8">
        <a href="/" class="text-xl uppercase tracking-[0.3em] text-white">Home</a>
        <a href="/about.html" class="text-xl uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-colors">About</a>
        <a href="/vision.html" class="text-xl uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-colors">Vision</a>
        <a href="/gallery.html" class="text-xl uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-colors">Gallery</a>
        <a href="/projects.html" class="text-xl uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-colors">Projects</a>
        <a href="/contact.html" class="text-xl uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-colors">Contact</a>
      </div>
    </nav>

    <!-- Desktop: Vertical Left Navigation (Diplomatic Pillar) -->
    <nav class="hidden lg:flex fixed left-12 top-1/2 -translate-y-1/2 z-30">
      <div class="flex flex-col space-y-6">
        <a href="/about.html" class="group flex items-center">
          <span
            class="text-xs uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-all duration-300 group-hover:translate-x-2">About</span>
          <span class="w-0 h-px bg-white ml-4 group-hover:w-8 transition-all duration-300"></span>
        </a>
        <a href="/vision.html" class="group flex items-center">
          <span
            class="text-xs uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-all duration-300 group-hover:translate-x-2">Vision</span>
          <span class="w-0 h-px bg-white ml-4 group-hover:w-8 transition-all duration-300"></span>
        </a>
        <a href="/gallery.html" class="group flex items-center">
          <span
            class="text-xs uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-all duration-300 group-hover:translate-x-2">Gallery</span>
          <span class="w-0 h-px bg-white ml-4 group-hover:w-8 transition-all duration-300"></span>
        </a>
        <a href="/projects.html" class="group flex items-center">
          <span
            class="text-xs uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-all duration-300 group-hover:translate-x-2">Projects</span>
          <span class="w-0 h-px bg-white ml-4 group-hover:w-8 transition-all duration-300"></span>
        </a>
        <a href="/contact.html" class="group flex items-center">
          <span
            class="text-xs uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-all duration-300 group-hover:translate-x-2">Contact</span>
          <span class="w-0 h-px bg-white ml-4 group-hover:w-8 transition-all duration-300"></span>
        </a>
      </div>
    </nav>

    <script>
      const menuBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        mobileMenu.classList.toggle('flex');
      });
    </script>



    <!-- Center/Bottom: Main Message -->
    <div class="relative z-10 h-full flex flex-col justify-center p-8 md:p-12 lg:pl-64 xl:pl-72">
      <div class="max-w-2xl">
        <h1 class="font-serif text-5xl md:text-7xl lg:text-8xl text-white mb-6 leading-none">
          Pan-African Diplomat<br />& Global Strategist
        </h1>
        <div class="w-24 h-px bg-white mb-6"></div>
        <p class="font-sans text-lg md:text-xl text-gray-300 tracking-[0.15em] uppercase font-light">
          Climate Resilience <span class="mx-3 text-white">•</span>
          Green Industrialization <span class="mx-3 text-white">•</span>
          Cultural Power
        </p>
      </div>
    </div>

  </div>

</body>

</html>

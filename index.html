<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Office of Dr. Ramatoulaye Diallo N'Diaye</title>
  <meta name="description"
    content="Pan-African Diplomat & Global Strategist for Climate Resilience, Green Industrialization, and Cultural Power." />
  <link rel="stylesheet" href="/src/index.css" />
</head>

<body class="h-full overflow-hidden bg-black text-white font-sans antialiased">

  <!-- Gateway Container - 100vh, No Scroll -->
  <div class="relative h-screen w-full overflow-hidden">

    <!-- Background Image -->
    <div class="absolute inset-0">
      <img src="/assets/portrait-professional-side.jpg" alt="Dr. Ramatoulaye Diallo N'Diaye"
        class="w-full h-full object-cover object-center filter grayscale" />
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent"></div>
    </div>

    <!-- Top Left Logo -->
    <div class="absolute top-8 left-8 md:top-12 md:left-12 z-20">
      <h2 class="font-serif text-base md:text-lg text-white tracking-wide max-w-xs leading-snug">
        The Office of<br />Dr. Ramatoulaye Diallo N'Diaye
      </h2>
    </div>

    <!-- Desktop: Vertical Left Navigation (Diplomatic Pillar) -->
    <nav class="hidden lg:flex fixed left-12 top-1/2 -translate-y-1/2 z-30">
      <div class="flex flex-col space-y-8">
        <a href="/about.html" class="group flex items-center">
          <span
            class="text-xs uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-all duration-300 group-hover:translate-x-2">About</span>
          <span class="w-0 h-px bg-white ml-4 group-hover:w-8 transition-all duration-300"></span>
        </a>
        <a href="/vision.html" class="group flex items-center">
          <span
            class="text-xs uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-all duration-300 group-hover:translate-x-2">Vision</span>
          <span class="w-0 h-px bg-white ml-4 group-hover:w-8 transition-all duration-300"></span>
        </a>
        <a href="/about.html#engagement" class="group flex items-center">
          <span
            class="text-xs uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-all duration-300 group-hover:translate-x-2">Engagement</span>
          <span class="w-0 h-px bg-white ml-4 group-hover:w-8 transition-all duration-300"></span>
        </a>
      </div>
    </nav>

    <!-- Mobile: Bottom Fixed Bar -->
    <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-30 bg-black/90 backdrop-blur-sm border-t border-white/10">
      <div class="flex justify-around items-center h-16 px-4">
        <a href="/about.html"
          class="text-xs uppercase tracking-[0.2em] text-gray-400 hover:text-white transition-colors">About</a>
        <a href="/vision.html"
          class="text-xs uppercase tracking-[0.2em] text-gray-400 hover:text-white transition-colors">Vision</a>
        <a href="/about.html#engagement"
          class="text-xs uppercase tracking-[0.2em] text-gray-400 hover:text-white transition-colors">Engagement</a>
      </div>
    </nav>

    <!-- Center/Bottom: Main Message -->
    <div class="relative z-10 h-full flex flex-col justify-end p-8 md:p-12 pb-24 lg:pb-12 lg:pl-64 xl:pl-80">
      <div class="max-w-4xl">
        <h1 class="font-serif text-5xl md:text-7xl lg:text-8xl text-white mb-6 leading-none">
          Pan-African Diplomat<br />& Global Strategist
        </h1>
        <div class="w-24 h-px bg-white mb-6"></div>
        <p class="font-sans text-lg md:text-xl text-gray-300 tracking-[0.15em] uppercase font-light">
          Climate Resilience <span class="mx-3 text-white">•</span>
          Green Industrialization <span class="mx-3 text-white">•</span>
          Cultural Power
        </p>
      </div>
    </div>

  </div>

</body>

</html>

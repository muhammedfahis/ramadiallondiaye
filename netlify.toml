[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  port = 5173

# Pretty URLs for static inner pages
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/vision"
  to = "/vision.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
